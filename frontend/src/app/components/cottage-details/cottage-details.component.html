<p>🏡 <b>Broj soba:</b>   {{ data.numOfRooms }}</p>
<p>🛏 <b>Broj kreveta:</b> {{ data.numOfBeds }}</p>
<p> <b>Uslovi otkazivanja:</b> {{data.cancellationCondition}}</p>
<p><b>Dodatne usluge (Izaberite koje zelite da ubacite u rezervaciju): </b></p>
<label *ngFor="let s of data.additionalServices" class= "service-item"  (change)="onCheckboxChange(s, $event)">
    <input type="checkbox" [value]="s"> {{s}}
</label>
<p> <b>Vlasnika vikendice:</b> {{data.owner.name+ " "+ data.owner.lastname}} </p>
