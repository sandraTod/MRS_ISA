

<div class="header">
  
    <button [routerLink]="['/fast-reservations']"
            [queryParams]="{ type: 'SHIP' }">
      🔥 View Discounts
    </button>
  
</div>

<div class="card-container">
    <div class = "card" *ngFor="let ship of shipList">

        <button class="subscribe-btn" (click)="subscribe(ship)">
            {{ ship.isSubscribed ? '❤️ Subscribed' : '🤍 Subscribe' }}
        </button>

        <h3>{{ship.name}}</h3>
        <p>{{ship.address}}</p>
        <p>{{ship.city}}</p>
        <p>{{ship.description}}</p>
        <p>Ocena ⭐: {{ship.avgGrade}}</p>

    </div>
</div>
