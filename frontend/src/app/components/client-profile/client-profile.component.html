
<div class = "container">
    <div class="card">
    
     <form  class ="form-grid" [formGroup]="updateForm" (ngSubmit)="onSubmit()">
    
        <div class="form-group" >
            <input type="email"  formControlName="username"  readonly>

        </div>

    
        <div class="form-group">
            <input type="text"  formControlName="name" >

            <div *ngIf="updateForm.get('name')?.touched && updateForm.get('name')?.invalid">
                <small class ="error-message" *ngIf = "updateForm.get('name')?.errors?.['required']" >
                    Obavezno polje
                </small>
            </div>
        </div>


        
        <div class="form-group">
            <input type="text"  placeholder = "Lastname" formControlName="lastname">

            <div *ngIf="updateForm.get('lastname')?.touched && updateForm.get('lastname')?.invalid">
                <small class ="error-message" *ngIf = "updateForm.get('lastname')?.errors?.['required']" >
                    Obavezno polje
                </small>
            </div>
        </div>
    
        <div class="form-group">
            <input type="text" placeholder = "Address" formControlName="address">

            <div *ngIf="updateForm.get('address')?.touched && updateForm.get('address')?.invalid">
                <small class ="error-message" *ngIf = "updateForm.get('address')?.errors?.['required']" >
                    Obavezno polje
                </small>
            </div>
        </div>
    
        <div class="form-group">
            <input type="text" placeholder="City" formControlName="city">

            <div *ngIf="updateForm.get('city')?.touched && updateForm.get('city')?.invalid">
                <small class ="error-message" *ngIf = "updateForm.get('city')?.errors?.['required']" >
                    Obavezno polje
                </small>
            </div>
        </div>
    
        <div class="form-group">
            <input type="text" placeholder="State" formControlName="state">

            <div *ngIf="updateForm.get('state')?.touched && updateForm.get('state')?.invalid">
                <small class ="error-message" *ngIf = "updateForm.get('state')?.errors?.['required']" >
                    Obavezno polje
                </small>
            </div>
        </div>
    
        <div class="form-group">
            <input type="text" placeholder = "Phone" formControlName="phoneNum">

            <div *ngIf="updateForm.get('phoneNum')?.touched && updateForm.get('phoneNum')?.invalid">
                <small class ="error-message" *ngIf = "updateForm.get('phoneNum')?.errors?.['required']" >
                    Obavezno polje
                </small>
            </div>
        </div>

        <button type="submit" [disabled]= "updateForm.invalid">Update</button>
    
    
     </form>

    </div>
  

    <div class="card">

            <h3>Change Password</h3>

        <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">

        <!-- OLD PASSWORD -->
        <div class="form-group">
            <input type="password" placeholder="Old password" formControlName="oldPassword">

            <small class="error-message"
            *ngIf="passwordForm.get('oldPassword')?.touched && passwordForm.get('oldPassword')?.invalid">
            Old password is required
            </small>
        </div>

        <!-- NEW PASSWORD -->
        <div class="form-group">
            <input type="password" placeholder="New password" formControlName="newPassword">

            <small class="error-message"
            *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.errors?.['required']">
            New password is required
            </small>

            <small class="error-message"
            *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">
            Minimum 6 characters
            </small>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
            <input type="password" placeholder="Confirm password" formControlName="confirmPassword">

            <small class="error-message"
            *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.get('confirmPassword')?.invalid">
            Potrebna je potvrda lozinke
            </small>

            <small class="error-message"
            *ngIf="!passwordsMatch() && passwordForm.get('confirmPassword')?.touched">
            Password-i se ne slazu
            </small>
        </div>

        <!-- BACKEND ERROR -->
        <small class="error-message" *ngIf="passwordError">
            {{ passwordError }}
        </small>

        <button type="submit" [disabled]="passwordForm.invalid || !passwordsMatch()">
            Change password
        </button>

        </form>
    </div>
</div>
